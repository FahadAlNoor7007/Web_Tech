<!DOCTYPE html>
<html>
<head>
    <title>Student Management - Fahad</title>
    <style>
        .present { background-color: green; }
        .highlight { border: 3px solid blue; padding: 10px; }
        .item { border-bottom: 1px solid white; padding: 8px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <h2>Student Management [23-52272-2]</h2>

    <input type="text" id="search" placeholder="Search student..." oninput="filter()">
    <br><br>

    <input type="text" id="name" placeholder="Name" oninput="check()">
    <input type="text" id="roll" placeholder="Roll No.">
    <button id="addBtn" onclick="add()" disabled>Add</button>
    <br><br>

    <button onclick="sortAZ()">Sort A-Z</button>
    <button onclick="highlightFirst()">Highlight First</button>

    <ul id="list"></ul>

    <p>Total students: <span id="total">0</span></p>
    <p>Present: <span id="pCount">0</span> | Absent: <span id="aCount">0</span></p>

    <script>
        let nameInp = document.getElementById('name');
        let rollInp = document.getElementById('roll');
        let addBtn = document.getElementById('addBtn');
        let list = document.getElementById('list');

        function check() {
            addBtn.disabled = nameInp.value.trim() === "";
        }

        function add() {
            let li = document.createElement('li');
            li.className = 'item';
            li.innerHTML = `
                <span class="info">${rollInp.value} - ${nameInp.value}</span>
                <button onclick="mark(this)">Present</button>
                <button onclick="edit(this)">Edit</button>
                <button onclick="del(this)">Delete</button>
            `;
            list.appendChild(li);
            nameInp.value = ""; 
            rollInp.value = ""; 
            check();
            update();
        }

        function del(btn) {
            if (confirm("Are you sure you want to delete this student?")) {
                btn.parentElement.remove();
                update();
            }
        }

        function edit(btn) {
            let span = btn.parentElement.querySelector('.info');
            let data = span.innerText.split(" - ");
            let r = prompt("Edit Roll:", data[0]);
            let n = prompt("Edit Name:", data[1]);
            if (r && n) span.innerText = r + " - " + n;
        }

        function filter() {
            let val = document.getElementById('search').value.toLowerCase();
            let items = list.getElementsByTagName('li');
            for (let i of items) {
                let text = i.innerText.toLowerCase();
                i.style.display = text.includes(val) ? "" : "none";
            }
        }

        function mark(btn) {
            btn.parentElement.classList.toggle('present');
            update();
        }

        function update() {
            let total = list.children.length;
            let present = document.querySelectorAll('.present').length;
            document.getElementById('total').innerText = total;
            document.getElementById('pCount').innerText = present;
            document.getElementById('aCount').innerText = total - present;
        }

        function sortAZ() {
            let items = Array.from(list.children);
            items.sort((a, b) => {
                let nA = a.querySelector('.info').innerText.split("-")[1].toLowerCase();
                let nB = b.querySelector('.info').innerText.split("-")[1].toLowerCase();
                return nA.localeCompare(nB);
            });
            items.forEach(i => list.appendChild(i));
        }

        function highlightFirst() {
            for (let i of list.children) i.classList.remove('highlight');
            if (list.children[0]) list.children[0].classList.add('highlight');
        }
    </script>
</body>
</html>
