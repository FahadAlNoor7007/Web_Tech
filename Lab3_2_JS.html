<!DOCTYPE html>
<html>
<body>
    <script>
        function calculateSum(a, b) {
            return a + b;
        }
        document.write("Sum: " + calculateSum(10, 20) + "<br><br>");

        for (let i = 1; i <= 10; i++) {
            document.write(i + " ");
        }
        
        document.write("<br>");
        
        let j = 1;
        while (j <= 20) {
            if (j % 2 === 0) document.write(j + " ");
            j++;
        }

        let name = "Fahad Al Noor";
        document.write("<br><br>Upper: " + name.toUpperCase());
        document.write("<br>Length: " + name.length);
        document.write("<br>First Name: " + name.split(" ")[0]);

        function check() {
            let val = prompt("Enter text:");
            if (val.length > 5) {
                alert("Greater than 5");
            } else {
                alert("Not greater than 5");
            }
        }
        check();
    </script>
</body>
</html>
